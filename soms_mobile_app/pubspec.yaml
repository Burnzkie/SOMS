name: soms_mobile
description: SOMS — SGO Edition mobile app (Student Organization Management System)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management — see 10-Mobile-Deployment.md Part B
  flutter_riverpod: ^2.5.1

  # HTTP client with Sanctum Bearer token interceptor
  dio: ^5.4.3+1

  # Token + offline scan queue storage — never SharedPreferences (03-Auth-Security.md)
  flutter_secure_storage: ^9.2.2

  # QR display, rendered client-side from the locally stored token
  qr_flutter: ^4.1.0

  # Officer camera-based scan fallback (USB/BT HID scanner is web-only)
  mobile_scanner: ^5.1.1

  # Officer calendar
  table_calendar: ^3.1.2

  # Push notifications — REMOVED FOR NOW, see note below.
  # firebase_core: ^3.1.0
  # firebase_messaging: ^15.0.1
  #
  # Why: firebase_core's bundled Windows CMake config (firebase_cpp_sdk_windows)
  # requires an old `cmake_minimum_required` syntax that newer CMake versions
  # (the one your fresh VS 2026 install ships) reject outright — a known
  # upstream compatibility gap, not something fixable from our side. Since
  # Firebase.initializeApp() was never called yet anyway (needs
  # google-services.json / GoogleService-Info.plist from your Firebase
  # console first — see README), there's nothing actually broken by pulling
  # these out now. Re-add both when you're ready to wire push notifications
  # for real; at that point also re-check whether newer firebase_core/
  # firebase_messaging releases have fixed the Windows CMake file, or just
  # skip Windows as a Firebase target (push is a mobile feature anyway —
  # desktop doesn't strictly need it).

  # Connectivity detection — drives the offline scan queue toggle and
  # auto-sync in providers/scan_providers.dart
  connectivity_plus: ^6.0.3

  cupertino_icons: ^1.0.6
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/SGO.png"
  min_sdk_android: 21
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icon/SGO_foreground.png"

flutter:
  uses-material-design: true